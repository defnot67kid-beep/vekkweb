<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRT-BOT · Dual Hook Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e0f11;
            color: #f3f3f4;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .hook-container {
            width: min(650px, 100%);
            background: rgba(34, 35, 40, .62);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0,0,0,.4);
        }
        .hook-container h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
            background: linear-gradient(135deg,#f0f2f5 30%,rgba(160,170,190,.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hook-container .sub {
            color: #969aa5;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .hook-group {
            background: rgba(0,0,0,.2);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
        }
        .hook-group h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #c9ced8;
        }
        .hook-group h3 span {
            color: #45dc93;
        }
        .hook-group .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .status.online { background: rgba(69,220,147,.15); color: #45dc93; border: 1px solid rgba(69,220,147,.2); }
        .status.offline { background: rgba(255,107,107,.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,.2); }
        .status.connecting { background: rgba(255,215,0,.15); color: #ffd700; border: 1px solid rgba(255,215,0,.2); animation: pulse 1s infinite; }
        
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            transition: .2s;
        }
        .input-group input:focus {
            border-color: rgba(82,113,255,.5);
            outline: none;
        }
        .input-group input::placeholder { color: #777983; }
        .input-group button {
            padding: 10px 20px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg,#5271ff,#354ee8);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
            font-size: 13px;
            white-space: nowrap;
        }
        .input-group button:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(82,113,255,.3); }
        .input-group button.danger { background: linear-gradient(135deg,#ff6b6b,#e04848); }
        .input-group button.danger:hover { box-shadow: 0 8px 25px rgba(255,107,107,.3); }

        .webhook-list {
            margin-top: 12px;
        }
        .webhook-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0,0,0,.12);
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,.04);
        }
        .webhook-item .name {
            font-size: 13px;
            font-weight: 500;
            color: #dbe1ff;
        }
        .webhook-item .url {
            font-size: 11px;
            color: #777983;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .webhook-item .actions button {
            border: 0;
            background: rgba(255,255,255,.06);
            color: #969aa5;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: .2s;
        }
        .webhook-item .actions button:hover { background: rgba(255,255,255,.12); color: #fff; }
        .webhook-item .actions button.delete:hover { background: rgba(255,107,107,.15); color: #ff6b6b; }

        .test-section {
            margin-top: 20px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(0,0,0,.15);
            border: 1px solid rgba(255,255,255,.05);
        }
        .test-section .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .test-section .row input {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
        }
        .test-section .row input::placeholder { color: #777983; }
        .test-section .row button {
            padding: 8px 16px;
            border: 0;
            border-radius: 8px;
            background: #45dc93;
            color: #0e0f11;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: .2s;
        }
        .test-section .row button:hover { transform: scale(1.03); }

        .log-area {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0,0,0,.2);
            border: 1px solid rgba(255,255,255,.04);
            max-height: 150px;
            overflow-y: auto;
            font-size: 11px;
            color: #969aa5;
            font-family: 'Courier New', monospace;
        }
        .log-area .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.02); }
        .log-area .log-entry .time { color: #555; }
        .log-area .log-entry .success { color: #45dc93; }
        .log-area .log-entry .error { color: #ff6b6b; }
        .log-area .log-entry .info { color: #5271ff; }

        .footer-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .footer-actions button {
            padding: 10px 24px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: .2s;
        }
        .footer-actions .primary { background: linear-gradient(135deg,#5271ff,#354ee8); color: #fff; }
        .footer-actions .primary:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(82,113,255,.3); }
        .footer-actions .secondary { background: rgba(255,255,255,.06); color: #969aa5; border: 1px solid rgba(255,255,255,.08); }
        .footer-actions .secondary:hover { background: rgba(255,255,255,.12); color: #fff; }

        @media(max-width:600px) {
            .hook-container { padding: 24px; }
            .input-group { flex-direction: column; }
            .webhook-item { flex-direction: column; gap: 6px; align-items: flex-start; }
            .webhook-item .url { max-width: 100%; }
            .test-section .row { flex-direction: column; }
            .test-section .row input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="hook-container">
        <h1>🔗 Dual Hook Manager</h1>
        <p class="sub">Manage your webhooks for VRT-BOT · Both hooks sync to the main site</p>

        <!-- Hook 1: Main Webhook -->
        <div class="hook-group">
            <h3>🟢 Hook 1: Main Receiver <span class="status online" id="status1">Online</span></h3>
            <div class="webhook-list" id="hook1List">
                <div class="webhook-item">
                    <div>
                        <div class="name">Main Webhook</div>
                        <div class="url" id="hook1Url">https://discord.com/api/webhooks/...</div>
                    </div>
                    <div class="actions">
                        <button onclick="editHook(1)">✏️</button>
                        <button class="delete" onclick="testHook(1)">🔍 Test</button>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="hook1Input" placeholder="Enter webhook URL" value="https://discord.com/api/webhooks/1543767493204779048/2ko8g9IU4yGXtwTv3qq4f8GPnxcYWGzb_bkiIt5QLajxSIL6B4YqVg9-QRrX3ZeIF8Uq">
                <button onclick="updateHook(1)">Update</button>
            </div>
        </div>

        <!-- Hook 2: Backup Webhook -->
        <div class="hook-group">
            <h3>🔵 Hook 2: Backup Receiver <span class="status connecting" id="status2">Connecting...</span></h3>
            <div class="webhook-list" id="hook2List">
                <div class="webhook-item">
                    <div>
                        <div class="name">Backup Webhook</div>
                        <div class="url" id="hook2Url">Not configured yet</div>
                    </div>
                    <div class="actions">
                        <button onclick="editHook(2)">✏️</button>
                        <button class="delete" onclick="testHook(2)">🔍 Test</button>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="hook2Input" placeholder="Enter backup webhook URL">
                <button onclick="updateHook(2)">Update</button>
            </div>
        </div>

        <!-- Test Section -->
        <div class="test-section">
            <div class="row">
                <input type="text" id="testUsername" placeholder="Test Username" value="TestUser">
                <input type="text" id="testVolts" placeholder="Volts" value="1000">
                <button onclick="sendTest()">🚀 Send Test</button>
            </div>
            <div class="log-area" id="logArea">
                <div class="log-entry"><span class="time">[System]</span> <span class="info">Ready. Hooks configured.</span></div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="footer-actions">
            <button class="primary" onclick="syncAll()">🔄 Sync to Main Site</button>
            <button class="secondary" onclick="clearLogs()">🗑️ Clear Logs</button>
            <button class="secondary" onclick="resetHooks()">🔄 Reset Hooks</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  HOOK MANAGER - Dual Hook System
        // ============================================================
        
        // Default hook URLs (stored in localStorage)
        const DEFAULT_HOOK_1 = "https://discord.com/api/webhooks/1543767493204779048/2ko8g9IU4yGXtwTv3qq4f8GPnxcYWGzb_bkiIt5QLajxSIL6B4YqVg9-QRrX3ZeIF8Uq";
        const DEFAULT_HOOK_2 = "";

        let hook1Url = localStorage.getItem('vrtHook1') || DEFAULT_HOOK_1;
        let hook2Url = localStorage.getItem('vrtHook2') || DEFAULT_HOOK_2;
        let hook1Enabled = true;
        let hook2Enabled = false;

        // ============================================================
        //  UI UPDATE FUNCTIONS
        // ============================================================
        function updateUI() {
            document.getElementById('hook1Url').textContent = hook1Url || 'Not configured';
            document.getElementById('hook2Url').textContent = hook2Url || 'Not configured';
            document.getElementById('hook1Input').value = hook1Url || '';
            document.getElementById('hook2Input').value = hook2Url || '';

            // Update statuses
            const status1 = document.getElementById('status1');
            const status2 = document.getElementById('status2');
            
            if (hook1Url) {
                status1.textContent = 'Online';
                status1.className = 'status online';
                hook1Enabled = true;
            } else {
                status1.textContent = 'Offline';
                status1.className = 'status offline';
                hook1Enabled = false;
            }

            if (hook2Url) {
                status2.textContent = 'Online';
                status2.className = 'status online';
                hook2Enabled = true;
            } else {
                status2.textContent = 'Offline';
                status2.className = 'status offline';
                hook2Enabled = false;
            }
        }

        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logArea').innerHTML = '';
            addLog('Logs cleared', 'info');
        }

        // ============================================================
        //  HOOK MANAGEMENT
        // ============================================================
        function updateHook(id) {
            const input = document.getElementById(`hook${id}Input`);
            const url = input.value.trim();
            if (id === 1) {
                hook1Url = url;
                localStorage.setItem('vrtHook1', url);
                addLog(`Hook 1 updated: ${url || 'disabled'}`, 'success');
            } else {
                hook2Url = url;
                localStorage.setItem('vrtHook2', url);
                addLog(`Hook 2 updated: ${url || 'disabled'}`, 'success');
            }
            updateUI();
            syncToMainSite();
        }

        function editHook(id) {
            const input = document.getElementById(`hook${id}Input`);
            input.focus();
            input.select();
            addLog(`Editing Hook ${id}...`, 'info');
        }

        function resetHooks() {
            if (confirm('Reset all hooks to default?')) {
                hook1Url = DEFAULT_HOOK_1;
                hook2Url = DEFAULT_HOOK_2;
                localStorage.setItem('vrtHook1', DEFAULT_HOOK_1);
                localStorage.setItem('vrtHook2', '');
                updateUI();
                addLog('Hooks reset to default', 'info');
                syncToMainSite();
            }
        }

        // ============================================================
        //  TEST HOOKS
        // ============================================================
        async function testHook(id) {
            const url = id === 1 ? hook1Url : hook2Url;
            if (!url) {
                addLog(`Hook ${id} not configured!`, 'error');
                return;
            }
            
            addLog(`Testing Hook ${id}...`, 'info');
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: "🧪 VRT-Bot Test",
                        embeds: [{
                            title: "🧪 Test Message",
                            description: `Hook ${id} is working correctly!`,
                            color: 0x45dc93,
                            fields: [
                                { name: "Status", value: "✅ Online", inline: true },
                                { name: "Timestamp", value: new Date().toISOString(), inline: true }
                            ],
                            timestamp: new Date().toISOString(),
                            footer: { text: "🧪 Test" }
                        }]
                    })
                });
                if (response.ok) {
                    addLog(`Hook ${id} test successful! ✅`, 'success');
                } else {
                    addLog(`Hook ${id} test failed: ${response.status}`, 'error');
                }
            } catch (e) {
                addLog(`Hook ${id} test error: ${e.message}`, 'error');
            }
        }

        // ============================================================
        //  SEND TEST DATA TO BOTH HOOKS
        // ============================================================
        async function sendTest() {
            const username = document.getElementById('testUsername').value.trim() || 'TestUser';
            const volts = parseInt(document.getElementById('testVolts').value) || 1000;

            addLog(`Sending test: ${username} - ${volts} volts`, 'info');

            const data = {
                username: "⚡ VRT-Bot",
                embeds: [{
                    title: "⚡ Test Volts Delivery",
                    description: `**${username}** just received ${volts} test volts!`,
                    color: 0xffd700,
                    fields: [
                        { name: "👤 User", value: `\`${username}\``, inline: true },
                        { name: "⚡ Volts", value: `\`${volts}\``, inline: true },
                        { name: "🕐 Timestamp", value: `\`${new Date().toISOString()}\``, inline: true },
                        { name: "🔗 Source", value: `\`Hook Manager\``, inline: false }
                    ],
                    timestamp: new Date().toISOString(),
                    footer: { text: "🧪 Test Mode" }
                }]
            };

            // Send to Hook 1
            if (hook1Url && hook1Enabled) {
                try {
                    const r1 = await fetch(hook1Url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                    if (r1.ok) addLog('✅ Hook 1: Test sent successfully', 'success');
                    else addLog(`❌ Hook 1: Failed (${r1.status})`, 'error');
                } catch (e) { addLog(`❌ Hook 1: ${e.message}`, 'error'); }
            } else {
                addLog('⚠️ Hook 1: Not enabled', 'info');
            }

            // Send to Hook 2
            if (hook2Url && hook2Enabled) {
                try {
                    const r2 = await fetch(hook2Url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                    if (r2.ok) addLog('✅ Hook 2: Test sent successfully', 'success');
                    else addLog(`❌ Hook 2: Failed (${r2.status})`, 'error');
                } catch (e) { addLog(`❌ Hook 2: ${e.message}`, 'error'); }
            } else {
                addLog('⚠️ Hook 2: Not enabled', 'info');
            }
        }

        // ============================================================
        //  SYNC TO MAIN SITE (Store hooks in localStorage)
        // ============================================================
        function syncToMainSite() {
            // Store in localStorage so the main site can access them
            localStorage.setItem('vrtHook1', hook1Url);
            localStorage.setItem('vrtHook2', hook2Url);
            localStorage.setItem('vrtHook1Enabled', hook1Enabled);
            localStorage.setItem('vrtHook2Enabled', hook2Enabled);
            addLog('🔄 Synced hooks to main site', 'success');
        }

        function syncAll() {
            syncToMainSite();
            // Also try to notify the main site if it's open
            try {
                window.opener?.postMessage({ type: 'syncHooks', hook1: hook1Url, hook2: hook2Url }, '*');
            } catch (e) {}
            addLog('✅ Full sync completed', 'success');
        }

        // ============================================================
        //  GET HOOKS (for main site to use)
        // ============================================================
        function getHooks() {
            return {
                hook1: hook1Url,
                hook2: hook2Url,
                hook1Enabled: hook1Enabled,
                hook2Enabled: hook2Enabled
            };
        }

        // ============================================================
        //  INIT
        // ============================================================
        updateUI();
        addLog('🚀 Hook Manager initialized', 'success');

        // Listen for messages from main site
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'getHooks') {
                e.source.postMessage({ type: 'hooks', data: getHooks() }, '*');
            }
        });

        // Expose functions globally
        window.updateHook = updateHook;
        window.editHook = editHook;
        window.testHook = testHook;
        window.resetHooks = resetHooks;
        window.sendTest = sendTest;
        window.syncAll = syncAll;
        window.clearLogs = clearLogs;
        window.syncToMainSite = syncToMainSite;
        window.getHooks = getHooks;
    </script>
</body>
</html>
